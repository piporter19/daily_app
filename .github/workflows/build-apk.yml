name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package.json']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the runner already has the Android SDK; just accept its licences so Gradle can fetch what it needs
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pip-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
